<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concourse Pipeline Viz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="top-left">
        <div class="logo-dot"></div>
        <span class="logo-text">concourse-pipeline-viz</span>
      </div>
      <div class="top-right">
        <div class="speed-ctrl">
          <span class="ctrl-lbl">speed</span>
          <button class="pill" data-speed="0.4">fast</button>
          <button class="pill on" data-speed="1">1x</button>
          <button class="pill" data-speed="2.5">slow</button>
          <input type="range" class="spd-slider" id="speed-slider" min="0.2" max="3" step="0.1" value="1" />
          <span class="spd-val" id="speed-val">1.0x</span>
        </div>
        <button class="btn" id="btn-replay">replay</button>
      </div>
    </header>
    <div class="main-layout">
      <aside class="left-panel">
        <div class="panel-section">
          <div class="panel-row">
            <label class="panel-label">Pipeline YAML</label>
            <select id="sample-select" class="sample-select">
              <option value="simple">Simple CI</option>
              <option value="parallel">Parallel Jobs</option>
              <option value="hooks">Hooks &amp; Nesting</option>
              <option value="complex">Complex Pipeline</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <textarea id="yaml-input" class="yaml-textarea" spellcheck="false" placeholder="Paste Concourse pipeline YAML here..."></textarea>
        </div>
        <div class="panel-actions">
          <button class="btn btn-primary" id="btn-animate">Animate <kbd>&#x2318;&#x21B5;</kbd></button>
          <label class="btn btn-file">
            Load file
            <input type="file" id="file-input" accept=".yml,.yaml" hidden />
          </label>
        </div>
        <div class="panel-section">
          <div class="warnings" id="warnings"></div>
        </div>
      </aside>
      <main class="right-panel">
        <div class="pipeline-info" id="pipeline-info"></div>
        <div class="viz-wrap" id="viz-output"></div>
      </main>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
